name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Validate example config
        run: python -m agent_model_migration_planner validate -c examples/migration-config.json
      - name: Generate example report
        run: python -m agent_model_migration_planner plan -c examples/migration-config.json --no-ci-fail --print-summary
