[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-model-migration-planner"
version = "0.1.0"
description = "Plan AI agent model migrations from prompts, configs, evals, and budget data."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "agent-model-migration-planner contributors"}
]
keywords = ["ai", "agents", "llm", "migration", "evals", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
agent-model-migration-planner = "agent_model_migration_planner.cli:main"
amm-plan = "agent_model_migration_planner.cli:main"

[tool.setuptools.packages.find]
include = ["agent_model_migration_planner*"]
